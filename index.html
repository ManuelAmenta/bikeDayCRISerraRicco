<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRI Serra Ricco BikeDay</title>

  <!-- Font Awesome per le icone -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

	body {
	  font-family: Arial, sans-serif;
	  background: linear-gradient(135deg, #fff1f1, #ffffff);
	  min-height: 100vh;
	  display: flex;
	  justify-content: center;
	  align-items: center;
	  padding: 20px;
	}

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      color: #d32f2f;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

	.card {
	  display: flex;
	  flex-direction: column;
	  align-items: center;
	  justify-content: center;
	  text-decoration: none;
	  background: #ffffff;
	  border-radius: 20px;
	  padding: 30px 20px;
	  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
	  transition: all 0.3s ease;
	  color: #333;
	  cursor: pointer;
	}


    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    .card i {
      font-size: 4rem;
      color: #d32f2f;
      margin-bottom: 20px;
    }

	.card span {
	  font-size: 1.2rem;
	  font-weight: bold;
	  line-height: 1.2;
	  margin-top: 0;
	}
	
	.card img.icon {
	  width: 130px;
	  height: 130px;
	  object-fit: contain;
	  margin-bottom: 4px;
	  display: block;
	}
	
	.logo {
	  display: block;
	  margin: 0 auto 20px auto; 
	  max-width: 250px;         
	  width: 100%;              
	  height: auto;   
	}
	
    footer {
      margin-top: 40px;
      color: #888;
      font-size: 0.9rem;
    }

	@media (max-width: 600px) {
	 
	  h1 {
		font-size: 1.8rem;
	  }

	  p {
		font-size: 1.15rem;
		margin-bottom: 30px;
	  }

	  .cards {
		grid-template-columns: 1fr;
		gap: 20px;
	  }

	  .card {
		padding: 30px 20px;
	  }

	  .card img.icon {
		width: 160px;
		height: 160px;
		margin-bottom: 1px;
	  }

	  .card span {
		font-size: 1.3rem;
		line-height: 1.25;
	  }

	  .logo {
		max-width: 250px;
		margin-bottom: 15px;
	  }

	  footer {
		font-size: 1rem;
		margin-top: 30px;
	  }
	}
  </style>
</head>
<body>
  <div class="container">
	<img src="logoCriSvg.png" alt="Logo CRI Serra Riccò" class="logo">    <h1>Percorsi BikeDay</h1>
    <p>Seleziona uno dei percorsi per aprirlo su Google Maps.</p>

    <div class="cards">
      <!-- Percorso 1 -->
      <a href="https://www.google.com/maps/d/edit?mid=17322yID4e6fkBwBSlZgANBGcPLxjpEo&usp=sharing" target="_blank" class="card">
        <img src="iconaMontagna.png" alt="Icona Montagna" class="icon">
		<span>Percorso ORERO</span>
      </a>

      <!-- Percorso 2 -->
      <a href="https://www.google.com/maps/d/edit?mid=15G8nfPjyXxmd6XJIJ0Qua68EUX-oRQ0&usp=sharing" target="_blank" class="card">
        <img src="iconaChiesa.png" alt="Icona Chiesa" class="icon">
        <span>Percorso VALLEREGIA</span>
      </a>

      <!-- Percorso 3 -->
      <a href="https://www.google.com/maps/d/edit?mid=1V0O7CP4_JDTk_Ha-N5PYQ7JFZ97hCvc&usp=sharing" target="_blank" class="card">
		<img src="iconaCabannina.png" alt="Icona Mucca" class="icon">
		<span>Percorso SERRA - SANCI - MIGNANEGO</span>
      </a>
    </div>

    <footer>
      Direzione gara: +39 3510202159
    </footer>
  </div>
</body>
</html>
