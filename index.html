<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Percorsi Google Maps</title>

  <!-- Font Awesome per le icone -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eaf4ff, #ffffff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      color: #1a73e8;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #ffffff;
      border-radius: 20px;
      padding: 40px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      transition: all 0.3s ease;
      color: #333;
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    .card i {
      font-size: 4rem;
      color: #1a73e8;
      margin-bottom: 20px;
    }

    .card span {
      font-size: 1.2rem;
      font-weight: bold;
    }

    footer {
      margin-top: 40px;
      color: #888;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .card {
        padding: 30px 15px;
      }

      .card i {
        font-size: 3rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>I Miei Percorsi</h1>
    <p>Seleziona uno dei percorsi per aprirlo su Google Maps.</p>

    <div class="cards">
      <!-- Percorso 1 -->
      <a href="INSERISCI_LINK_1" target="_blank" class="card">
        <i class="fas fa-route"></i>
        <span>Percorso 1</span>
      </a>

      <!-- Percorso 2 -->
      <a href="INSERISCI_LINK_2" target="_blank" class="card">
        <i class="fas fa-map-location-dot"></i>
        <span>Percorso 2</span>
      </a>

      <!-- Percorso 3 -->
      <a href="INSERISCI_LINK_3" target="_blank" class="card">
        <i class="fas fa-location-arrow"></i>
        <span>Percorso 3</span>
      </a>
    </div>

    <footer>
      Sostituisci INSERISCI_LINK_1, INSERISCI_LINK_2 e INSERISCI_LINK_3 con i tuoi link di Google Maps.
    </footer>
  </div>
</body>
</html>
